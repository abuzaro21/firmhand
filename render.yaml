# Render Blueprint. Free plan only: one web service and one free PostgreSQL 16 database.
# autoDeploy is off; deploys are triggered deliberately. No paid resources are declared.
services:
  - type: web
    name: firmhand
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIRMHAND_TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: firmhand-db
          property: connectionString
databases:
  - name: firmhand-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
